name: EinfachStart 91 – Emulator-Test

on:
  workflow_dispatch:
  push:
    branches: ['arena/f1d8df85-msus']
    paths:
      - '.github/workflows/emulator-test.yml'
      - '.emulator-trigger'

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  instrumented-test:
    name: Installation und UI-Test auf Android-Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Java 17 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Vorinstalliertes Android-SDK und Werkzeugpfade finden
        run: |
          SDK_MANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f -print -quit)
          test -n "$SDK_MANAGER" || { echo "::error::sdkmanager nicht gefunden"; exit 1; }
          echo "$(dirname "$SDK_MANAGER")" >> "$GITHUB_PATH"
          for TOOL_DIR in "$ANDROID_HOME/platform-tools" "$ANDROID_HOME/emulator"; do
            test -d "$TOOL_DIR" && echo "$TOOL_DIR" >> "$GITHUB_PATH"
          done
          export PATH="$(dirname "$SDK_MANAGER"):$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          sdkmanager --version
          echo "::notice::SDK-Werkzeugpfad: $(dirname "$SDK_MANAGER")"

      - name: SDK, Emulator und System-Image installieren
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64" 2>&1 | tee sdk-install.log
          sdkmanager --list_installed | grep 'system-images' || true

      - name: App- und Test-APK bauen
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug assembleAndroidTest --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: KVM für Hardwarebeschleunigung freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Emulator starten, APK installieren und UI testen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_8
          avd-name: einfachstart91-test
          cores: 2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: |
            set -o pipefail
            APP_APK=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -1)
            TEST_APK=$(find app/build/outputs/apk/androidTest -name "*.apk" -type f | head -1)
            test -n "$APP_APK" && test -n "$TEST_APK"
            echo "App-APK: $APP_APK"
            echo "Test-APK: $TEST_APK"
            adb install -r "$APP_APK"
            adb install -r "$TEST_APK"
            adb shell pm dump de.einfachstart91.launcher | grep -m1 -A2 'android.intent.action.MAIN' || true
            adb shell am instrument -w -r -e debug false de.einfachstart91.launcher.test/androidx.test.runner.AndroidJUnitRunner | tee emulator-test-output.txt
            grep -q "OK (" emulator-test-output.txt

      - name: Testergebnis und Diagnose speichern
        if: always()
        run: |
          mkdir -p test-report
          {
            echo "EinfachStart 91 – Emulator-Testbericht"
            echo "Datum (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
            echo "Job-Status: ${{ job.status }}"
            echo "Emulator: Android 15 (API 35), google_apis, x86_64, Pixel-8-Profil"
            echo
            echo "=== Instrumentation-Ausgabe ==="
            cat emulator-test-output.txt 2>/dev/null || echo "Keine Ausgabe vorhanden."
            echo
            echo "=== Gradle-Build (Auszug) ==="
            tail -30 gradle-build.log 2>/dev/null || echo "Kein Gradle-Protokoll vorhanden."
            echo
            echo "=== SDK-Installation (Auszug) ==="
            tail -20 sdk-install.log 2>/dev/null || echo "Kein SDK-Protokoll vorhanden."
          } > test-report/emulator-test.txt
          cp gradle-build.log test-report/gradle-build.log 2>/dev/null || true
          cp emulator-test-output.txt test-report/emulator-test-output.txt 2>/dev/null || true
          cp sdk-install.log test-report/sdk-install.log 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f test-report/emulator-test.txt
          for LOG in test-report/gradle-build.log test-report/emulator-test-output.txt test-report/sdk-install.log; do
            test -f "$LOG" && git add -f "$LOG"
          done
          if git diff --cached --quiet; then
            echo "Keine Änderung am Testbericht."
          else
            git commit -m "Test: Emulator-Bericht für EinfachStart 91"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
