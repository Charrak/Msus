name: EinfachStart 91 – APK bauen

on:
  workflow_dispatch:
  push:
    branches: ['arena/0245f451-msus']
    paths:
      - '.github/workflows/build-apk.yml'
      - '.build-trigger'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Debug-APK bauen und prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Java 17 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Vorinstalliertes Android-SDK und sdkmanager finden
        run: |
          echo "::notice::JAVA_HOME=$JAVA_HOME"
          echo "::notice::ANDROID_HOME=$ANDROID_HOME"
          SDK_MANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f -print -quit)
          test -n "$SDK_MANAGER" || { echo "::error::sdkmanager nicht gefunden"; exit 1; }
          SDK_BIN=$(dirname "$SDK_MANAGER")
          echo "::notice::sdkmanager: $SDK_MANAGER"
          echo "$SDK_BIN" >> "$GITHUB_PATH"
          echo "::notice::Plattformen vorher: $(ls "$ANDROID_HOME/platforms" 2>/dev/null | tr '\n' ' ')"
          echo "::notice::Build-Tools vorher: $(ls "$ANDROID_HOME/build-tools" 2>/dev/null | tr '\n' ' ')"
          export PATH="$SDK_BIN:$PATH"
          sdkmanager --version

      - name: SDK-Komponenten installieren
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "::notice::Plattformen: $(ls "$ANDROID_HOME/platforms" | tr '\n' ' ')"
          echo "::notice::Build-Tools: $(ls "$ANDROID_HOME/build-tools" | tr '\n' ' ')"

      - name: APK bauen
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Gradle-Protokoll bei Fehler sichern
        if: failure()
        run: |
          mkdir -p build-report
          cp gradle-build.log build-report/gradle-build.log 2>/dev/null || echo "Kein Gradle-Protokoll vorhanden." > build-report/gradle-build.log
          push_with_retry() {
            for attempt in 1 2 3 4 5; do
              git fetch origin "$GITHUB_REF_NAME"
              git rebase "origin/$GITHUB_REF_NAME" || return 1
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                return 0
              fi
              echo "Push-Versuch $attempt fehlgeschlagen, synchronisiere erneut."
              sleep 5
            done
            return 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build-report/gradle-build.log
          if ! git diff --cached --quiet; then
            git commit -m "Build: Gradle-Protokoll zur Fehlerdiagnose"
            push_with_retry
          fi

      - name: APK ausliefern und prüfen
        run: |
          set -euo pipefail
          mkdir -p apk build-report
          APP_APK=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -1)
          test -n "$APP_APK"
          cp "$APP_APK" apk/EinfachStart91.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          if [ ! -x "$AAPT" ]; then AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | head -1); fi
          "$AAPT" dump badging apk/EinfachStart91.apk > build-report/badging.txt
          "$AAPT" dump xmltree apk/EinfachStart91.apk AndroidManifest.xml > build-report/manifest.txt
          grep -q "android.intent.action.MAIN" build-report/manifest.txt
          grep -q "android.intent.category.HOME" build-report/manifest.txt
          if grep -q "uses-permission: name='android.permission.INTERNET'" build-report/badging.txt; then
            echo "::error::Unerwartete INTERNET-Berechtigung in der APK."
            exit 1
          fi
          if ! grep -q "uses-permission: name='android.permission.READ_CONTACTS'" build-report/badging.txt; then
            echo "::error::READ_CONTACTS-Berechtigung für die Kontaktauswahl fehlt."
            exit 1
          fi
          {
            echo "EinfachStart 91 – Build-Bericht"
            echo "Datum (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
            echo "APK-Größe: $(stat -c%s apk/EinfachStart91.apk) Byte"
            echo "SHA-256: $(sha256sum apk/EinfachStart91.apk | cut -d' ' -f1)"
            echo
            echo "=== Berechtigungen ==="
            grep "uses-permission" build-report/badging.txt || echo "(keine)"
            echo
            echo "=== Launcher-Prüfung ==="
            echo "MAIN + HOME im Manifest gefunden."
            echo "Keine INTERNET-Berechtigung gefunden."
            echo "READ_CONTACTS ausschließlich für die bewusste Kontaktauswahl gefunden."
          } > build-report/apk-info.txt
          ls -lh apk/EinfachStart91.apk

      - name: APK und Bericht auf den Branch committen
        run: |
          push_with_retry() {
            for attempt in 1 2 3 4 5; do
              git fetch origin "$GITHUB_REF_NAME"
              git rebase "origin/$GITHUB_REF_NAME" || return 1
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                return 0
              fi
              echo "Push-Versuch $attempt fehlgeschlagen, synchronisiere erneut."
              sleep 5
            done
            return 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apk/EinfachStart91.apk build-report/badging.txt build-report/manifest.txt build-report/apk-info.txt
          if git diff --cached --quiet; then
            echo "Keine Änderung am Build-Ergebnis."
          else
            git commit -m "Build: EinfachStart91.apk und APK-Prüfbericht"
            push_with_retry
          fi

      - name: APK zusätzlich als Actions-Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: EinfachStart91-APK
          path: apk/EinfachStart91.apk
          if-no-files-found: error
