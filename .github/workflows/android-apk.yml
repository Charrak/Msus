name: 📱 Android APK bauen

# Start: manuell über den "Actions"-Tab (Run workflow) oder per Git-Tag (z. B. v1.0.0)
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build-Typ (Release braucht Keystore-Secrets, siehe README)'
        type: choice
        options: [debug, release]
        default: debug
  push:
    tags: ['v*']

permissions:
  contents: write   # für GitHub-Releases bei Tags

jobs:
  apk:
    name: APK (${{ inputs.build_type || 'debug' }})
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
    steps:
      - name: ⬇️ Code auschecken
        uses: actions/checkout@v4

      - name: 🟢 Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: ☕ Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Kein setup-android-Action nötig: Das Android SDK ist auf ubuntu-latest vorinstalliert.
      # Wir akzeptieren nur Lizenzen und stellen sicher, dass Plattform 36 + Build-Tools da sind.
      - name: 🤖 Android SDK bereitstellen
        run: |
          echo "::notice::Java: $(java -version 2>&1 | head -1) | ANDROID_HOME=$ANDROID_HOME | Plattformen vorher: $(ls $ANDROID_HOME/platforms 2>/dev/null | tr '\n' ' ')"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null || echo "::warning::sdkmanager-Installation fehlgeschlagen – nutze vorinstallierte Pakete"
          echo "::notice::Plattformen nachher: $(ls $ANDROID_HOME/platforms 2>/dev/null | tr '\n' ' ') | Build-Tools: $(ls $ANDROID_HOME/build-tools 2>/dev/null | tr '\n' ' ')"
          test -d "$ANDROID_HOME/platforms/android-36"

      - name: 📦 Abhängigkeiten installieren
        run: npm ci

      - name: 🌐 Web-App bauen
        run: npm run build

      - name: 🔄 Capacitor synchronisieren
        run: npx cap sync android

      # ---------- nur für Release: Keystore aus Secrets ----------
      # (Hinweis: "secrets" darf nicht in if-Bedingungen stehen -> Prüfung im Skript)
      - name: 🔑 Keystore aus Secrets wiederherstellen
        if: env.BUILD_TYPE == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::error::Für einen Release-Build fehlen Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, ANDROID_STORE_PASSWORD (Anleitung im README unter 'APK bauen')."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          cat > android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # ---------- APK bauen ----------
      - name: 🏗️ APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: 📲 APK umbenennen
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/$BUILD_TYPE/*.apk "out/BLOHSH-Hub-$BUILD_TYPE.apk"
          ls -lh out/

      - name: ⬆️ APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: BLOHSH-Hub-APK-${{ env.BUILD_TYPE }}
          path: out/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: 🚀 Bei Tag zur GitHub-Release hinzufügen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
